[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boothmate"
version = "2.0.0.dev0"  # must match the FL controller script; plugin has its own version
description = "BoothMate: make beats and run recording sessions in FL Studio by asking Claude. Fork of flstudio-mcp."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "BlackAcre AI LLC" },
    { name = "rosasynthesiz (upstream flstudio-mcp)" },
]
requires-python = ">=3.10"
keywords = ["mcp", "mcp-server", "model-context-protocol", "fl-studio", "flstudio", "fruity-loops", "fruityloops", "daw", "music-production", "mixing", "midi", "ai", "ai-music", "claude", "cursor", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
]
dependencies = [
    "fastmcp>=2.0.0,<5",      # tested with 4.2; a new major needs a check first
    "pydantic>=2.7.0",
    "mido>=1.3.2",
    "python-rtmidi>=1.5.8",
    # Piano-roll script trigger. Windows only: macOS sends the key through
    # System Events (osascript), so no GUI-automation package is installed there.
    "pyautogui>=0.9.54; sys_platform == 'win32'",
    "pygetwindow>=0.0.9; sys_platform == 'win32'",  # Windows focus helper
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
# Audio analysis (Integration 2/3). Needs ffmpeg on PATH for MP3 decoding.
audio = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.24",
    "scipy>=1.10",
]
# The upstream 'audio-accurate' (torch/CREPE) and 'audio-chords' (Basic Pitch)
# extras are left out of BoothMate to keep installs light; the tools fall back
# to the [audio] engines or report the feature as unavailable.

[project.scripts]
boothmate = "fl_studio_mcp.server:main"
boothmate-daemon = "fl_studio_mcp.daemon:main"
fl-studio-mcp = "fl_studio_mcp.server:main"
fl-studio-mcp-daemon = "fl_studio_mcp.daemon:main"

[project.urls]
Homepage = "https://github.com/BlackFOXsolve/boothmate-plugin"
Repository = "https://github.com/BlackFOXsolve/boothmate-plugin"
Issues = "https://github.com/BlackFOXsolve/boothmate-plugin/issues"
Upstream = "https://github.com/rosasynthesiz/flstudio-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_studio_mcp"]

# Ship the FL controller script inside the wheel so `fl-studio-mcp setup`
# works from PyPI / uvx with no git clone.
[tool.hatch.build.targets.wheel.force-include]
"fl_controller/FLStudioMCP/device_FLStudioMCP.py" = "fl_studio_mcp/_controller/device_FLStudioMCP.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -rA --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
